<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe Distance: Cities</title>
<style>
:root{--bg:#0a1018;--panel:#121b27;--text:#e8eef5;--muted:#8fa0b3;--accent:#ff8a3d;--line:#26344a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#globe{position:absolute;inset:0}
#ui{position:absolute;top:12px;left:12px;right:12px;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:8px;z-index:2}
.field{position:relative}
input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input::placeholder{color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:0;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:5}
.sugg li{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg li:last-child{border-bottom:0}
.sugg li:hover{background:var(--line)}
.sugg small{color:var(--muted)}
#result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none}
#dist{font-size:26px;font-weight:700;color:var(--accent);margin:0}
#sub{font-size:13px;color:var(--muted);margin:2px 0 0}
#msg{font-size:13px;color:var(--muted);margin:0 2px}
button{font:inherit;font-size:14px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div id="globe"></div>
<div id="ui">
  <div class="field"><input id="in0" placeholder="From: city name" autocomplete="off"><ul class="sugg" id="s0" hidden></ul></div>
  <div class="field"><input id="in1" placeholder="To: city name" autocomplete="off"><ul class="sugg" id="s1" hidden></ul></div>
  <p id="msg">Search for two cities, or click the globe to drop a pin.</p>
  <div id="result">
    <p id="dist"></p><p id="sub"></p>
    <button id="reset">Reset</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
<script>
const GEO='https://geocoding-api.open-meteo.com/v1/search';
const slots=[null,null];
const inputs=[document.getElementById('in0'),document.getElementById('in1')];
const lists=[document.getElementById('s0'),document.getElementById('s1')];
const msg=document.getElementById('msg'),result=document.getElementById('result'),
      distEl=document.getElementById('dist'),subEl=document.getElementById('sub');

const globe=Globe()(document.getElementById('globe'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .pointColor(()=>'#ff8a3d').pointAltitude(0.02).pointRadius(0.6)
  .pointLabel(p=>p.name)
  .arcColor(()=>['#ffd166','#ff8a3d']).arcStroke(0.6).arcAltitudeAutoScale(0.4)
  .width(innerWidth).height(innerHeight)
  .onGlobeClick(({lat,lng})=>{
    let i=slots[0]?(slots[1]?0:1):0;
    if(slots[0]&&slots[1]){slots[0]=slots[1]=null;inputs.forEach(x=>x.value='');}
    setSlot(i,{name:'Pin '+lat.toFixed(2)+', '+lng.toFixed(2),lat,lng});
  });
addEventListener('resize',()=>globe.width(innerWidth).height(innerHeight));

function haversine(a,b){
  const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmt=n=>Math.round(n).toLocaleString('en-GB');

function setSlot(i,place){
  slots[i]=place;inputs[i].value=place.name;lists[i].hidden=true;render();
}
function render(){
  const pts=slots.filter(Boolean);
  globe.pointsData(pts);
  if(slots[0]&&slots[1]){
    const [a,b]=slots,km=haversine(a,b);
    globe.arcsData([{startLat:a.lat,startLng:a.lng,endLat:b.lat,endLng:b.lng}]);
    distEl.textContent=fmt(km)+' km';
    subEl.textContent=fmt(km*0.621371)+' miles · '+a.name+' to '+b.name;
    result.style.display='block';msg.style.display='none';
    globe.pointOfView({lat:(a.lat+b.lat)/2,lng:midLng(a.lng,b.lng),altitude:Math.min(3.2,1.2+km/9000)},1000);
  }else{
    globe.arcsData([]);result.style.display='none';msg.style.display='block';
    if(pts[0])globe.pointOfView({lat:pts[0].lat,lng:pts[0].lng,altitude:1.8},800);
  }
}
function midLng(a,b){ // handles the antimeridian
  let d=b-a;if(d>180)d-=360;if(d<-180)d+=360;
  let m=a+d/2;return m>180?m-360:m<-180?m+360:m;
}

document.getElementById('reset').onclick=()=>{
  slots[0]=slots[1]=null;inputs.forEach(x=>x.value='');render();
};

// City search with debounce and stale-response protection
inputs.forEach((inp,i)=>{
  let timer,reqId=0;
  inp.addEventListener('input',()=>{
    clearTimeout(timer);
    if(slots[i]){slots[i]=null;render();}
    const q=inp.value.trim();
    if(q.length<2){lists[i].hidden=true;return;}
    timer=setTimeout(async()=>{
      const id=++reqId;
      try{
        const r=await fetch(GEO+'?name='+encodeURIComponent(q)+'&count=5&language=en&format=json');
        const data=await r.json();
        if(id!==reqId)return;
        showSuggestions(i,data.results||[]);
      }catch(e){lists[i].hidden=true;msg.textContent='City search failed. Check your connection.';}
    },300);
  });
  inp.addEventListener('blur',()=>setTimeout(()=>lists[i].hidden=true,200));
});

function showSuggestions(i,results){
  const ul=lists[i];ul.replaceChildren();
  if(!results.length){const li=document.createElement('li');li.textContent='No matches';ul.append(li);ul.hidden=false;return;}
  results.forEach(c=>{
    const li=document.createElement('li');
    const region=[c.admin1,c.country].filter(Boolean).join(', ');
    li.append(document.createTextNode(c.name+' '));
    const s=document.createElement('small');s.textContent=region;li.append(s);
    li.onclick=()=>setSlot(i,{name:c.name+(c.country?', '+c.country:''),lat:c.latitude,lng:c.longitude});
    ul.append(li);
  });
  ul.hidden=false;
}
</script>
</body>
</html>
